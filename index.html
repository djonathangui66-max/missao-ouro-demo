<div class="demo-header" role="note"><span><b>★ DEMONSTRAÇÃO PÚBLICA</b> · dados fictícios · nenhuma ação afeta a academia</span><div class="demo-controls"><button onclick="missaoDemoSwitch('demo-admin')">📊 Ver gerente</button><button onclick="missaoDemoSwitch('demo-member-1')">🎯 Ver recepção</button><button onclick="missaoDemoReset()">↻ Reiniciar</button></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TV_MODE = new URLSearchParams(location.search).has('tv');
const SHIFTS={morning:'☀️ Manhã',intern:'🎓 Estagiária',afternoon:'🌙 Tarde / Noite'};
const KIND={contacts:'Contatos',leads:'Indicações',routine:'Rotina',training:'Treinamento'};
const TIERS={bronze:['🥉','Bronze'],prata:['🥈','Prata'],ouro:['🥇','Ouro'],diamante:['💎','Diamante'],lendario:['🌟','Lendário']};
let token=localStorage.getItem('missao.demo.token')||'demo-admin', session=null, publicData=null, me=null, admin=null, report=null, outcomesReport=null;
let crmData=null,appointmentData=null,crmShowClosed=false,agendaFilter='active';
let view='ranking',adminTab='overview',editShift='morning',editMemberId=null,draft=null,reportDate='',focusId=null,modal='',soundEnabled=false;
let syncTimer=null,lastRefresh=0,alerted=new Set(),isBusy=false;
let alertsAdmin=null,noticeOnScreen=null,alertInFlight=false;
let adminNoticeWatchRunning=false,adminNoticeEventId=0,adminNoticeWatchInitialized=false;
let soundContext=null;
function num(n){return Number(n||0).toLocaleString('pt-BR')}
function pct(v,max){return max>0?Math.min(100,Math.max(0,Math.round(100*v/max))):0}
function formatDuration(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function fmtMin(m){m=Math.max(0,Number(m)||0);return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`}
function remaining(t){const elapsed=Number(t.elapsed||0)+(t.started_at?Math.max(0,Math.floor(Date.now()/1000-t.started_at)):0);return t.minutes*60-elapsed}
function fmtTimer(t){const n=remaining(t);const a=Math.abs(n);return (n<0?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')}
function initials(name){return String(name||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function dateLabel(date){return new Date(`${date}T12:00:00`).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}
function atMinute(str){if(!/^\d{2}:\d{2}$/.test(String(str||'')))throw new Error('Informe HH:MM');const [h,m]=str.split(':').map(Number);if(h>23||m>59)throw new Error('Horário inválido');return h*60+m}
function clockMinute(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
function plannerSegments(p){const windows=(p.windows||[]).map(([x,y])=>[atMinute(x),atMinute(y)]).sort((a,b)=>a[0]-b[0]);if(!windows.length||windows.some(([a,b])=>b<=a))throw new Error('Revise entrada e saída');if(windows.some((w,i)=>i&&windows[i-1][1]>w[0]))throw new Error('Faixas sobrepostas');const breaks=(p.breaks||[]).map(([x,y])=>[atMinute(x),atMinute(y)]).sort((a,b)=>a[0]-b[0]);if(breaks.some(([a,b])=>b<=a||!windows.some(([x,y])=>x<=a&&b<=y)))throw new Error('Intervalo deve ficar dentro do expediente');if(breaks.some((w,i)=>i&&breaks[i-1][1]>w[0]))throw new Error('Intervalos sobrepostos');const out=[];for(const [a,b] of windows){let pos=a;for(const [x,y] of breaks){if(x>=a&&y<=b){if(pos<x)out.push([pos,x]);pos=y}}if(pos<b)out.push([pos,b])}return out}
function calcCapacity(p){return plannerSegments(p).reduce((n,[a,b])=>n+b-a,0)-(+p.break_minutes||0)}
function planned(p){return (p.items||[]).reduce((v,t)=>v+(Number(t.minutes)||0),0)}
function plannerWarnings(p){const segments=plannerSegments(p),r=[],seen=[];for(let i=0;i<p.items.length;i++){const t=p.items[i],str=t.start_time;if(!str){r.push(`Bloco ${i+1} sem início`);continue}const a=atMinute(str),b=a+(Number(t.minutes)||0);if(!segments.some(([x,y])=>x<=a&&b<=y))r.push(`Bloco ${i+1} atravessa um intervalo ou está fora da jornada`);for(const [x,y,j] of seen)if(a<y&&x<b)r.push(`Bloco ${i+1} sobrepõe bloco ${j}`);seen.push([a,b,i+1])}return r}
function autoDistribute(p){const seg=plannerSegments(p);let idx=0,pos=seg[0]?.[0]||0;for(const t of p.items){while(idx<seg.length){const [a,b]=seg[idx];pos=Math.max(pos,a);if(pos+Number(t.minutes)<=b)break;idx++;if(idx<seg.length)pos=seg[idx][0]}if(idx>=seg.length)t.start_time='';else{t.start_time=clockMinute(pos);pos+=Number(t.minutes)}}}
function editingPlan(){if(editMemberId===null)return admin.plans[editShift];const mid=String(editMemberId);return admin.member_plans?.[mid]||admin.plans[admin.members.find(x=>x.id===editMemberId)?.shift||editShift]}
function loadEditingPlan(){draft=structuredClone(editingPlan());if(!Array.isArray(draft.breaks))draft.breaks=[];if(draft.break_minutes&&!draft.breaks.length){draft.break_minutes=Number(draft.break_minutes)||0};if(draft.reserve_minutes===undefined)draft.reserve_minutes=0;for(const t of draft.items){if(t.start_time===undefined)t.start_time=''}}
function meta(t){return t.kind==='contacts'||t.kind==='leads'?`Meta: ${t.goal} ${KIND[t.kind].toLowerCase()}`:KIND[t.kind]}
function toast(message,type=''){const e=document.createElement('div');e.className='toast '+type;e.textContent=message;$('#toasts').append(e);setTimeout(()=>e.remove(),3800)}
function successSound(){if(!soundEnabled)return;try{soundContext=soundContext||new(window.AudioContext||window.webkitAudioContext)();soundContext.resume();[523,659,784,1046].forEach((hz,i)=>{const o=soundContext.createOscillator(),g=soundContext.createGain();o.type='sine';o.connect(g);g.connect(soundContext.destination);o.frequency.setValueAtTime(hz,soundContext.currentTime+i*.105);g.gain.setValueAtTime(.001,soundContext.currentTime+i*.105);g.gain.exponentialRampToValueAtTime(.075,soundContext.currentTime+i*.105+.01);g.gain.exponentialRampToValueAtTime(.001,soundContext.currentTime+i*.105+.17);o.start(soundContext.currentTime+i*.105);o.stop(soundContext.currentTime+i*.105+.18)})}catch{}}
function fireworks(message='🚀 MISSÃO CONCLUÍDA ANTES DO PRAZO!'){const fx=$('#fx');fx.replaceChildren();const banner=document.createElement('div');banner.className='win-banner';banner.innerHTML=`${ESC(message)}<small>Mais uma conquista para o seu dia! ✨</small>`;fx.append(banner);
 for(let i=0;i<12;i++){const r=document.createElement('div');r.className='rocket';r.textContent=i%4===0?'✨':'🚀';r.style.setProperty('--x',`${Math.random()*100}%`);r.style.setProperty('--delay',`${Math.random()*.55}s`);r.style.setProperty('--dur',`${1.45+Math.random()*.5}s`);fx.append(r)}
 for(let j=0;j<5;j++){const cx=16+Math.random()*69,cy=15+Math.random()*42;for(let i=0;i<16;i++){const angle=i*Math.PI/8,radius=50+Math.random()*95,sp=document.createElement('div');sp.className='spark';sp.style.setProperty('--x',`${cx}%`);sp.style.setProperty('--y',`${cy}%`);sp.style.setProperty('--dx',`${Math.cos(angle)*radius}px`);sp.style.setProperty('--dy',`${Math.sin(angle)*radius}px`);sp.style.setProperty('--delay',`${j*.10}s`);sp.style.setProperty('--color',i%4===0?'#b7ffce':i%3===0?'#ffffff':'#f7ca6b');fx.append(sp)}}successSound();setTimeout(()=>fx.replaceChildren(),2700)}
async function api(path,options={}){return window.demoApi(path,options,token)}
async function refreshCRM(){if(!session)return;crmData=await api('/api/crm')}
async function refreshAppointments(){if(!session)return;appointmentData=await api('/api/appointments')}
async function refreshPublic(){publicData=await api('/api/public')}
async function refreshSession(){if(!token){session=null;return}try{session=await api('/api/session');if(session.role==='member'){me=await api('/api/me');if(!focusId)focusId=me.daily.tasks.find(t=>!t.done)?.id||me.daily.tasks[0]?.id;view='mission'}else{admin=await api('/api/admin');view='admin'}}catch{token='';localStorage.removeItem('missao.demo.token');session=null;view='ranking'}}
async function boot(){if(location.protocol==='file:'){$('#app').innerHTML=`<div style="max-width:650px;margin:12vh auto;padding:24px"><div class="glass" style="padding:32px"><img src="logo.webp" width="100" alt="Logo"><h1>Missão Ouro</h1><p>Este sistema utiliza um servidor local para que todas visualizem o mesmo ranking de agendamentos.</p><p>Para utilizar, extraia a pasta completa e abra <b>INICIAR_USINA.bat</b> no computador da academia. Depois acesse o endereço indicado.</p></div></div>`;return}
 try{await refreshPublic();await refreshSession();if(TV_MODE){view='ranking';document.body.classList.add('tv-mode')}reportDate=publicData.date;render();/* apresentação estática: sem receptor Windows */;syncTimer=setInterval(sync,5500);setInterval(tickClocks,300);setInterval(checkTeamNotices,2400);setTimeout(checkTeamNotices,1000)}catch(err){$('#app').innerHTML=`<div class="empty" style="padding:15vh 20px"><span class="emoji">⚠️</span><h3>Central temporariamente indisponível</h3><p>${ESC(err.message)}</p><button class="btn gold space-top" onclick="location.reload()">Tentar novamente</button></div>`}}
async function sync(){if(isBusy)return;try{await refreshPublic();if(session?.role==='member')me=await api('/api/me');if(session?.role==='admin'&&view==='admin'&&adminTab==='overview')admin=await api('/api/admin');
 if(view==='crm'){await refreshCRM();if(!$('#crmClientForm')||!$('#crmClientForm').contains(document.activeElement))renderPage();}else if(view==='appointments'){await refreshAppointments();renderPage();}else if(view==='ranking'){$('#page').innerHTML=rankingPage();}else if(view==='mission') {updateMissionLive();}else if(view==='admin'&&adminTab==='overview'){$('#adminArea').innerHTML=adminOverview();}
 const status=$('#lastSync');if(status)status.textContent='Atualizado agora';
 }catch(e){const status=$('#lastSync');if(status)status.textContent='Sem conexão — tentando reconectar'}}
function topInfo(){return view==='crm'?['Minha carteira • 3 dias','Seus clientes têm prioridade com você durante 3 dias úteis.']:view==='appointments'?['Agenda da equipe','Agendamentos compartilhados e retornos no prazo.']:view==='mission'?['Sua missão de hoje','Transforme cada atividade em uma conquista.']:view==='ranking'?['Placar de agendamentos','Uma equipe, muitas conquistas. Todos os resultados do dia.']:view==='achievements'?['Suas conquistas','Cada passo importante merece reconhecimento.']:['Central do gerente','Planejamento, acompanhamento e resultados da equipe.']}
function shell(){const [title,sub]=topInfo();return `<div class="shell"><aside class="sidebar"><div class="brand"><img src="logo.webp" alt="Usina do Corpo Alvorada"><div class="brand-name"><strong>MISSÃO OURO</strong><small>USINA ALVORADA</small></div></div><div class="nav-title">CENTRAL</div><nav class="side-nav" aria-label="Menu principal">
${nav('mission','🗺️','Minha missão')}${nav('crm','📇','Minha carteira · 3 dias')}${nav('appointments','📅','Agenda da equipe')}${nav('ranking','🏆','Ranking diário')}${nav('achievements','💎','Conquistas')}${nav('admin','⚙️','Gerente')}
</nav><div class="side-bottom"><div class="online"><span class="dot"></span> <span>Apresentação offline</span></div><p>Dados fictícios · Esta demonstração não está conectada à academia.</p>${session?`<div class="side-user"><span>${ESC(session.role==='admin'?'Gerente':session.member.name)}</span><button class="logout" data-action="logout">Sair</button></div>`:`<div class="side-user"><span>Visitante</span><button class="logout" data-action="login">Entrar</button></div>`}</div></aside><div class="main"><div class="topbar"><div><div class="eyebrow">🏋️ USINA DO CORPO · ALVORADA</div><h1>${ESC(title)}</h1><p class="sub">${ESC(sub)}</p></div><div class="top-actions"><span class="live-chip"><span class="dot"></span><span id="lastSync">Atualizado agora</span></span><span class="date-chip">📅 ${ESC(dateLabel(publicData?.date||new Date().toISOString().slice(0,10)))}</span>${session?`<button class="btn soft sm" data-action="logout">Sair</button>`:`<button class="btn gold sm" data-action="login">Entrar</button>`}</div></div><main id="page">${page()}</main><div class="hint" style="text-align:center;margin:35px 0 12px">MISSÃO OURO · USINA ALVORADA · PLACAR ALIMENTADO PELOS REGISTROS DA EQUIPE</div></div></div>`}
function nav(key,emoji,label){return `<button class="nav-btn ${view===key?'selected':''}" data-nav="${key}"><span class="ico">${emoji}</span><span class="nav-text">${label}</span></button>`}
function page(){if(view==='crm')return session?crmPage():entryPrompt('Sua carteira é privada','Entre com seu perfil para cadastrar contatos e acompanhar seus 3 dias úteis.');if(view==='appointments')return session?appointmentsPage():entryPrompt('Agenda compartilhada','Entre para acompanhar os agendamentos da equipe.');if(view==='ranking')return rankingPage();if(view==='mission')return session?.role==='member'?missionPage():entryPrompt('Sua missão começa aqui','Escolha seu perfil para visualizar suas tarefas, pontuar e registrar agendamentos.');if(view==='achievements')return session?.role==='member'?achievementsPage():entryPrompt('Suas conquistas estão esperando','Entre com seu perfil para acompanhar medalhas e pontos.');if(view==='admin')return session?.role==='admin'?adminPage():entryPrompt('Área do gerente','O gerente pode editar blocos, horários, contas e visualizar resultados.');return ''}
function entryPrompt(title,msg){return `<div class="glass empty" style="max-width:660px;margin:32px auto"><span class="emoji">🏅</span><h3>${ESC(title)}</h3><p>${ESC(msg)}</p><button class="btn gold space-top" data-action="login">Entrar na Central</button></div>`}
function render(){document.title='Missão Ouro • Usina Alvorada';$('#app').innerHTML=shell();attachSpecial()}
function renderPage(){const [t,s]=topInfo();$('.topbar h1').textContent=t;$('.topbar .sub').textContent=s;$$('.nav-btn').forEach(b=>b.classList.toggle('selected',b.dataset.nav===view));$('#page').innerHTML=page();attachSpecial()}
function metricCard(label,value,target,icon,foot){return `<article class="glass stat"><span class="glyph">${icon}</span><div class="stat-k">${label}</div><strong>${num(value)}<small> / ${num(target)}</small></strong><div class="progress-track"><div style="width:${pct(value,target)}%"></div></div><div class="hint">${ESC(foot)}</div></article>`}
function missionPage(){if(!me)return entryPrompt('Carregando missão','');const m=me.metrics,p=me.plan,d=me.daily,focus=d.tasks.find(t=>t.id===focusId)||d.tasks.find(t=>!t.done)||d.tasks[0];focusId=focus?.id;
 return `<div class="hero"><section class="glass welcome"><div class="eyebrow">✨ OPERAÇÃO ALVORADA</div><h2>Vamos transformar <span class="gradient-text">esforço em conquistas</span>, ${ESC(me.member.name.split(' ')[0])}!</h2><p>Um bloco por vez. Faça pausas para atender, retome de onde parou e comemore suas vitórias.</p><div class="pill">${ESC(SHIFTS[me.member.shift])} · ${ESC(p.windows.map(w=>w.join('–')).join(' · '))}${p.break_minutes?' · '+p.break_minutes+' min de intervalo':''}</div></section>
 <section class="glass goalbox"><div><div class="eyebrow">🎯 SUA META DE AGENDAMENTOS</div><div class="xl" id="heroBookings">${d.bookings}<span> / ${p.goals.bookings}</span></div><div class="progress-track" style="margin:14px 0"><div id="heroBookingBar" style="width:${pct(d.bookings,p.goals.bookings)}%"></div></div><div class="hint">Cada agendamento registrado aparece no ranking da equipe.</div></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn gold block" data-action="goCRM">📅 Agendar cliente da carteira</button></div></section></div>
 <section class="stats">${metricCard('BLOCOS CONCLUÍDOS',m.blocks,m.total_blocks,'✅','Missões realizadas')}${metricCard('CONTATOS',m.contacts,p.goals.contacts,'📞','Conversas registradas')}${metricCard('INDICAÇÕES',m.leads,p.goals.leads,'💡','Novas oportunidades')}${metricCard('EXPERIÊNCIA',m.xp,(m.level)*250,'💎',`Nível ${m.level} · ${m.badges.length} selos · ${m.sales} vendas`)}</section>
 <div class="two-col"><div><div class="section-title"><h2>⚡ Bloco em destaque</h2><span class="pill">${m.blocks}/${d.tasks.length} realizados</span></div><section id="focusPanel">${focus?focusBlock(focus):'<div class="empty">Sem afazeres cadastrados.</div>'}</section><div class="section-title"><h2>🗂️ Roteiro do turno</h2><span class="overline">CLIQUE PARA ABRIR UM BLOCO</span></div><div class="tasks-list" id="taskList">${tasksList(d.tasks)}</div><div class="section-title"><h2>📝 Fechamento do turno</h2></div><section class="glass" style="padding:19px"><label class="label" for="dailyNotes">Observações e oportunidades para o gerente</label><textarea class="field" id="dailyNotes" placeholder="Resultados, dificuldades, pendências e próximos passos...">${ESC(d.notes)}</textarea><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px"><button class="btn soft" data-action="copyMyReport">📋 Copiar relatório</button><button class="btn gold" data-action="saveNotes">💾 Salvar observações</button></div></section></div>
 <aside><div class="section-title"><h2>🏆 Placar ao vivo</h2><button class="btn sm soft" data-nav="ranking">Ver todos →</button></div><div class="glass side-card" id="miniRanking">${miniRanking()}</div><div class="glass side-card tip-card"><h3>💡 Missão do dia</h3><p class="feed">Agendamentos ajudam o time a crescer, mas completar as atividades e registrar contatos também vale experiência. Seu ritmo importa!</p><div class="divider"></div><div class="hint">⏱️ Timer negativo registra o tempo excedido. Pausas não entram na contagem.</div></div><div class="glass side-card"><h3>💎 Medalhas desbloqueadas</h3><div class="top-achievements">${m.badges.length?m.badges.slice(0,6).map(b=>`<div class="achievement"><span>${b.icon}</span><strong>${ESC(b.name)}</strong></div>`).join(''):'<div class="hint">Conclua seu primeiro bloco para ganhar uma medalha.</div>'}</div><button class="btn soft block space-top" data-nav="achievements">Todas as conquistas →</button></div><div class="glass side-card"><h3>🔊 Celebrações</h3><p class="feed">Ao concluir antes do prazo, você ganha foguetes e fogos dourados!</p><button class="btn soft block" data-action="toggleSound">${soundEnabled?'🔊 Som ativado':'🔇 Ativar som de vitória'}</button></div></aside></div>`}
function focusBlock(t){const done=t.done,r=remaining(t),running=!!t.started_at,over=r<0,progress=pct(t.minutes*60-r,t.minutes*60);const i=me.daily.tasks.findIndex(x=>x.id===t.id);
 return `<div class="glass focus"><div class="focus-head"><span class="tag">⚡ MISSÃO ${String(i+1).padStart(2,'0')} · ${t.minutes} MINUTOS</span><span class="status ${done?'done':running?'running':over?'over':''}">${done?'✓ Concluído':running?over?'⏱️ Tempo excedido':'● Cronômetro ativo':'Pronto para começar'}</span></div><h3>${ESC(t.title)}</h3><div class="focus-desc">${t.start_time?`🕒 Início previsto ${ESC(t.start_time)} · Término ${ESC(t.end_time)} · `:`⚠️ Sem horário planejado · `}${ESC(meta(t))} · ${done&&t.early?'🚀 Finalizado antes do tempo · ':''}O relógio para somente quando você pausa ou finaliza.</div><div class="focus-mid"><div><div class="timer ${over?'overtime':''}" data-clock="${ESC(t.id)}">${fmtTimer(t)}</div><div class="timer-caption">${done?'Tempo registrado':'Tempo restante (negativo = excedido)'}</div></div><div class="task-ring" style="--fill:${progress}%"><span>${Math.min(100,progress)}%</span></div></div><div class="focus-actions"><button class="btn ${running?'soft':'gold'} big" data-task="${ESC(t.id)}" data-task-action="${running?'pause':'start'}" ${done?'disabled':''}>${running?'⏸ Pausar':'▶ '+(t.elapsed?'Continuar':'Iniciar missão')}</button><button class="btn green big" data-task="${ESC(t.id)}" data-task-action="complete" ${done?'disabled':''}>✓ Finalizar bloco</button><button class="btn soft" data-task="${ESC(t.id)}" data-task-action="reset" title="Reiniciar cronômetro e status">↺</button></div>
 ${(t.kind==='contacts'||t.kind==='leads')?`<div class="inline-meta"><div class="counter"><span>Resultado realizado</span><button class="btn soft sm" data-action="countMinus" ${t.count<=0?'disabled':''}>−</button><strong>${t.count}</strong><button class="btn soft sm" data-action="countPlus">＋</button><span>/ ${t.goal}</span></div></div>`:''}

const NOTICE_WEEKDAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function noticeWhen(ts){return new Date(ts*1000).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function noticeStatusLine(item){if(item.completed_at)return item.skipped_count&&!item.sent_count?'Não enviado (atrasou)':'Concluído';return item.active?'Ativo':'Pausado'}
function alertSchedulesMarkup(){const data=alertsAdmin?.schedules||[];if(!data.length)return '<p class="hint">Nenhum aviso agendado. Abra “Programar” acima para criar o primeiro.</p>';return data.map(n=>`<div class="schedule-row"><div><strong>${ESC(n.title)}</strong><div class="hint">${ESC(n.mode==='once'?'Único':'Recorrente: '+n.weekdays.map(x=>['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][x]).join(', '))} · ${ESC(alertsAdmin.audiences?.[n.audience]||n.audience)}</div><p>${noticeStatusLine(n)} · ${n.active?'Próximo: '+noticeWhen(n.next_run_at):n.last_sent_at?'Último envio: '+noticeWhen(n.last_sent_at):'Aguardando'} · ${n.sent_count} envio(s)${n.skipped_count?' · '+n.skipped_count+' ignorado(s) por atraso':''}</p></div><div class="controls">${!n.completed_at?`<button type="button" class="btn sm ${n.active?'danger':'soft'}" data-schedule-toggle="${n.id}" data-schedule-active="${n.active?'0':'1'}">${n.active?'Pausar':'Reativar'}</button>`:''}</div></div>`).join('')}

function refreshAlertPanels(){if(session?.role!=='admin'||view!=='admin'||adminTab!=='alerts')return;const panels={'#alertHistory':alertHistoryMarkup(),'#alertDevices':alertDevicesMarkup(),'#alertSchedules':alertSchedulesMarkup(),'#alertLiveActivity':alertActivityMarkup()};for(const [selector,markup] of Object.entries(panels)){const el=$(selector);if(el)el.innerHTML=markup}}
async function createScheduledNotice(){const title=$('#alertTitle')?.value.trim(),message=$('#alertMessage')?.value.trim(),priority=$('#alertPriority')?.value,audience=$('#alertAudience')?.value,mode=$('#alertScheduleMode')?.value,time=$('#alertScheduleTime')?.value;
 if(!title||!message)return toast('Preencha título e comunicado.','bad');
 const payload={title,message,priority,audience,mode,time};if(mode==='once')payload.date=$('#alertScheduleDate')?.value;else{payload.weekdays=$$('[name="alertWeekday"]:checked').map(x=>Number(x.value));payload.end_date=$('#alertScheduleEnd')?.value||null}
 if(!confirm('Programar o aviso nos horários escolhidos?'))return;
 const result=await api('/api/admin/alerts/schedule',{method:'POST',body:JSON.stringify(payload)});await loadAlertsAdmin();refreshAlertPanels();toast('✅ Aviso programado para '+noticeWhen(result.next_run_at),'good')}
async function toggleNoticeSchedule(button){const schedule_id=Number(button.dataset.scheduleToggle),active=button.dataset.scheduleActive==='1';if(!confirm(active?'Reativar este agendamento?':'Pausar este agendamento?'))return;await api('/api/admin/alerts/schedule-toggle',{method:'POST',body:JSON.stringify({schedule_id,active})});await loadAlertsAdmin();refreshAlertPanels();toast(active?'Programação reativada.':'Programação pausada.','good')}
async function exportNoticeReport(){const day=$('#alertReportDate')?.value||publicData.date;const data=await api('/api/admin/alerts/report?date='+encodeURIComponent(day));const rows=[['Data do relatório','Horário de Brasília','Tipo de evento','Quem/Computador','Aviso','Destino','Origem']];for(const e of data.events){rows.push([day,noticeWhen(e.happened_at),e.event_type==='sent'?'Enviado':'Confirmou leitura',e.actor,e.title,e.audience,e.event_type==='ack_windows'?'Receptor Windows':e.event_type==='ack_site'?'Perfil da consultora':'Servidor'])}const cell=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('Confirmacoes_Missao_Ouro_'+day+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Relatório exportado.','good')}
async function startAdminNoticeWatch(){if(adminNoticeWatchRunning||session?.role!=='admin')return;adminNoticeWatchRunning=true;
 try{if(!alertsAdmin)await loadAlertsAdmin();adminNoticeEventId=alertsAdmin.last_event_id||0;adminNoticeWatchInitialized=true;
 while(session?.role==='admin'){
  try{const data=await api('/api/admin/alerts/watch?since='+adminNoticeEventId);if(session?.role!=='admin')break;
   if(data.events?.length){adminNoticeEventId=Math.max(adminNoticeEventId,data.last_event_id);for(const e of data.events){if(e.event_type==='ack_windows'||e.event_type==='ack_site')toast('✅ '+e.actor+' confirmou: '+e.title,'good');else if(e.event_type==='sent')toast('📢 Aviso publicado: '+e.title,'good')};if(view==='admin'&&adminTab==='alerts'){await loadAlertsAdmin();refreshAlertPanels()}}
  }catch(err){if(session?.role!=='admin')break;await new Promise(r=>setTimeout(r,3000))}
 }
 }catch(err){console.warn('Central de avisos:',err)}finally{adminNoticeWatchRunning=false}}

function drawNoticePopup(n){if(noticeOnScreen)return;noticeOnScreen=n;const stage=document.createElement('div');stage.className='notice-stage';stage.id='active-notice-stage';const card=document.createElement('section');card.className='notice-popup '+n.priority;card.setAttribute('role','alertdialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-label','Aviso da gerência');const icon=document.createElement('span');icon.className='big-icon';icon.textContent=n.priority==='urgent'?'🚨':n.priority==='important'?'⚠️':'📢';const title=document.createElement('h2');title.textContent=n.title;const msg=document.createElement('p');msg.textContent=n.message;const foot=document.createElement('div');foot.className='notice-foot';foot.textContent='MISSÃO OURO · AVISO DA GERÊNCIA';const button=document.createElement('button');button.className='btn gold big block';button.textContent='✓ Li e entendi';button.onclick=async()=>{button.disabled=true;try{await api('/api/alerts/ack',{method:'POST',body:JSON.stringify({notice_id:n.id})});stage.remove();noticeOnScreen=null;setTimeout(checkTeamNotices,100)}catch(e){button.disabled=false;toast(e.message,'bad')}};card.append(icon,title,msg,foot,button);stage.append(card);$('#notice-stage-root').append(stage);button.focus();try{if(soundEnabled){soundContext=soundContext||new(window.AudioContext||window.webkitAudioContext)();soundContext.resume();const osc=soundContext.createOscillator(),gain=soundContext.createGain();osc.connect(gain);gain.connect(soundContext.destination);osc.frequency.value=n.priority==='urgent'?880:660;gain.gain.value=.07;osc.start();osc.stop(soundContext.currentTime+.16)}}catch{}}

<div class="crm-outcome-stats"><div class="glass crm-outcome-tile won"><span>💰 Fecharam plano</span><strong>${isAdmin?all.filter(c=>c.status==='won').length:counts.mine_won||0}</strong><small>Clientes com venda registrada</small></div><div class="glass crm-outcome-tile lost"><span>📁 Clientes perdidos</span><strong>${isAdmin?all.filter(c=>c.status==='lost').length:counts.mine_lost||0}</strong><small>Motivo documentado para análise</small></div></div>
${!isAdmin?`<form class="glass crm-create" id="crmClientForm"><div class="section-title" style="margin:0 0 14px"><h2>➕ Primeiro contato</h2><span class="hint">Só você vê esse cliente durante o prazo.</span></div><div class="form-grid"><div><label class="label" for="crmName">Nome do cliente</label><input id="crmName" class="field" name="client_name" required maxlength="100" autocomplete="off" placeholder="Ex.: Ana Paula"></div><div><label class="label" for="crmPhone">WhatsApp com DDD</label><input id="crmPhone" class="field" name="client_phone" type="tel" inputmode="tel" required placeholder="(51) 99999-9999"></div><button class="btn gold" type="submit">✨ Cadastrar contato</button></div></form>`:''}
<div class="crm-toolbar"><h2>🔐 ${isAdmin?'Todos os clientes':'Meus clientes'}</h2>${!isAdmin?`<button class="btn soft sm" data-action="toggleClosed">${crmShowClosed?'Ocultar':'Mostrar'} concluídos</button>`:''}</div>
<div class="crm-card-grid">${(isAdmin?all:my).map(c=>crmCard(c,isAdmin)).join('')||'<div class="crm-empty">Nenhum contato cadastrado ainda. O primeiro cadastro inicia a contagem dos dias úteis.</div>'}</div>
<div class="crm-toolbar"><h2>🟣 Oportunidades liberadas</h2><span class="pill">${publicClients.length} disponíveis</span></div>
<div class="crm-note"><strong>🔄 Como funciona:</strong> quando o terceiro dia útil termina, o contato passa a roxo e pode ser assumido por outra consultora. Ao assumir, começa um novo ciclo de 3 dias úteis. Contatos agendados ficam com a titular até o prazo do retorno: o dia útil seguinte à data marcada.</div>
<div class="crm-card-grid">${publicClients.map(c=>crmCard(c,isAdmin)).join('')||'<div class="crm-empty">🎉 Nenhum contato liberado neste momento. A equipe está cuidando das oportunidades!</div>'}</div>`}
function crmCard(c,adminMode=false){const [icon,label,color]=crmStatus(c);const mine=session?.role==='member'&&c.owner_id===session.member.id;const canClaim=c.status==='public'&&!mine&&!adminMode;const canBook=mine&&(c.status==='green'||c.status==='yellow');const canResolve=mine&&['green','yellow','booked','closed'].includes(c.status);const phone=c.phone||'';
const desc=c.status==='green'||c.status==='yellow'?`Dia ${Math.max(1,c.day_index)}/3 · até ${crmLongDay(c.expires_after)}`:c.status==='public'?`Livre desde ${crmLongDay(c.public_from)}`:c.status==='booked'?'Ver detalhes na Agenda da equipe':c.status==='won'?'Venda arquivada no histórico':c.status==='lost'?'Cliente encerrado com motivo documentado':'Acompanhamento encerrado';
return `<article class="crm-card ${color}"><div class="crm-card-title"><h3>${ESC(c.name)}</h3><span class="crm-status ${color}">${icon} ${label}</span></div><div class="crm-card-sub">👩‍💼 Titular: ${ESC(c.owner_name)} · primeiro contato ${crmLongDay(c.first_contact_day)}</div><div class="crm-metadata"><span class="crm-mini">⏳ ${ESC(desc)}</span>${(c.status==='green'||c.status==='yellow')?`<span class="crm-mini">🔒 Liberação: ${crmLongDay(c.public_from)}</span>`:''}</div>${phone?`<div class="crm-phone">📱 ${ESC(phone)}</div>`:''}<div class="crm-actions">${phone?`<a class="btn whatsapp" href="${crmWhats(phone)}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`:''}${canBook?`<button class="btn gold" data-crm-book="${c.id}">📅 Agendar</button>`:''}${canClaim?`<button class="btn gold" data-crm-claim="${c.id}">🤝 Assumir</button>`:''}${canResolve?`<button class="btn result-win" data-crm-outcome="won" data-crm-client="${c.id}">💰 Fechou plano</button><button class="btn result-lost" data-crm-outcome="lost" data-crm-client="${c.id}">📁 Cliente perdido</button>`:''}${c.status==='booked'?`<button class="btn soft" data-action="goAgenda">📆 Ver agenda</button>`:''}</div>${c.note?`<p class="hint" style="margin:10px 0 0">📝 ${ESC(c.note)}</p>`:''}${c.lost_reason?`<p class="hint">📁 Motivo: ${ESC(c.lost_reason)}</p>`:''}</article>`}

function appointmentsPage(){if(!appointmentData)return '<div class="glass empty">Carregando agenda...</div>';const all=appointmentData.appointments||[];const due=all.filter(a=>a.is_owner&&a.status==='scheduled'&&['today','late'].includes(a.followup_status));const upcoming=all.filter(a=>a.status==='scheduled');const completed=all.filter(a=>['followed_up','reassigned','converted','lost'].includes(a.status));let rows=agendaFilter==='mine'?all.filter(a=>a.is_owner):agendaFilter==='due'?due:agendaFilter==='finished'?completed:upcoming;
rows=[...rows].sort((a,b)=>a.scheduled_day.localeCompare(b.scheduled_day)||a.scheduled_time.localeCompare(b.scheduled_time));
return `<div class="crm-hero"><div class="glass crm-intro"><div class="eyebrow">📅 AGENDA DE TODA A EQUIPE</div><h2>Agendou? <span class="gradient-text">Todo mundo acompanha.</span></h2><p>Todos visualizam o nome do cliente, data, horário e titular. O telefone permanece disponível somente para a titular e o gerente enquanto o contato está protegido.</p><div class="crm-legend"><span>📅 Agendamento confirmado</span><span>📞 Retorno no próximo dia útil após a visita</span><span>✅ Retorno registrado</span></div></div><div class="glass crm-side"><div><div class="eyebrow">AGENDAMENTOS ATIVOS</div><b>${upcoming.length}</b><small>Visualização compartilhada em tempo real</small></div><div class="pill">📞 ${due.length} retorno(s) exigindo atenção</div></div></div>
<div class="agenda-tabs">${[['active','📆 Em aberto'],['mine','🙋 Meus agendamentos'],['due','⚡ Meus retornos'],['finished','✅ Encerrados']].map(([k,v])=>`<button class="btn ${agendaFilter===k?'selected':''}" data-agenda-filter="${k}">${v}</button>`).join('')}</div>
<div class="agenda-list">${rows.map(agendaCard).join('')||'<div class="crm-empty">Nenhum agendamento nessa visualização. Cadastre um na carteira para começar! 🎯</div>'}</div>
<div class="crm-privacy space-top">🔒 Os contatos privados não são divulgados à equipe. Todos veem a agenda, mas os telefones continuam restritos às titulares até a liberação do prazo.</div>`}
function agendaCard(a){const dateSplit=a.scheduled_day.split('-');const owned=session?.role==='member'&&a.owner_id===session.member.id;const stat=a.client_resolution==='won'?['💰 Plano fechado','won']:a.client_resolution==='lost'?['📁 Cliente perdido','lost']:a.status==='followed_up'?['✅ Retorno concluído','closed']:a.status==='reassigned'?['🟣 Repassado à equipe','purple']:a.followup_status==='late'?['🟣 Prazo vencido','purple']:a.followup_status==='today'?['🟡 Retorno hoje','yellow']:['📅 Agendado','booked'];const canFollow=owned&&a.status==='scheduled'&&a.scheduled_day<=appointmentData.date&&a.followup_status!=='late';
return `<article class="glass agenda-card"><div class="agenda-date"><b>${dateSplit[2]}</b><span>${dateSplit[1]}/${dateSplit[0]}</span></div><div class="agenda-main"><div class="eyebrow">${ESC(a.scheduled_time)} · ${ESC(a.owner_name)}</div><h3>${ESC(a.client_name)}</h3><p class="hint">Cliente agendado por ${ESC(a.owner_name)} em ${crmLongDay(a.booked_day)}</p><div class="agenda-meta"><span>⏰ Visita ${crmLongDay(a.scheduled_day)} às ${ESC(a.scheduled_time)}</span><span>📞 Prazo do retorno: ${crmLongDay(a.followup_due)}</span>${a.phone?`<span>📱 ${ESC(a.phone)}</span>`:''}</div></div><div class="agenda-side"><span class="crm-status ${stat[1]}">${stat[0]}</span>${a.phone?`<a class="btn sm green" href="${crmWhats(a.phone)}" rel="noopener noreferrer" target="_blank">💬 WhatsApp</a>`:''}${canFollow?`<button class="btn gold sm" data-ap-follow="${a.id}">✅ Fiz o retorno</button>`:''}${owned&&a.status==='scheduled'?`<button class="btn soft sm" data-ap-cancel="${a.id}">Cancelar agendamento</button>`:''}</div></article>`}
async function crmCreateClient(e){e.preventDefault();if(isBusy)return;isBusy=true;const form=e.target,submit=form.querySelector('[type=submit]');submit.disabled=true;try{const name=form.querySelector('#crmName').value,phone=form.querySelector('#crmPhone').value;await api('/api/crm/create',{method:'POST',body:JSON.stringify({name,phone})});await refreshCRM();renderPage();toast('🟢 Cliente cadastrado! Contagem dos 3 dias úteis iniciada.','good');successSound()}catch(error){toast(error.message,'bad');submit.disabled=false}finally{isBusy=false}}
function openCRMOutcome(id,result){if(session?.role!=='member')return toast('Acesse seu perfil de consultora.','bad');const c=crmData?.mine.find(x=>x.id===id);if(!c)return toast('Contato não encontrado.','bad');const won=result==='won';const modalBox=document.createElement('div');modalBox.id='crmOutcomeModal';modalBox.className='modal-wrap';modalBox.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Resultado do cliente"><div class="eyebrow">${won?'💰 FECHAMENTO':'📁 ENCERRAMENTO'}</div><h2 style="margin:9px 0">${ESC(c.name)}</h2><p class="sub">${won?'Registre o plano fechado para entrar nas conquistas e estatísticas.':'Registre o motivo da perda para preservar o histórico do atendimento.'}</p><form id="crmOutcomeForm" class="fields space-top">${won?`<div><label class="label" for="outcomeValue">Valor do plano em R$ (opcional)</label><input class="field" id="outcomeValue" type="text" inputmode="decimal" placeholder="Ex.: 149,90"></div>`:`<div><label class="label" for="outcomeReason">Motivo *</label><select class="field" id="outcomeReason" required><option value="">Escolha um motivo</option><option>Sem interesse</option><option>Preço / orçamento</option><option>Não respondeu</option><option>Optou por outra academia</option><option>Outro motivo</option></select></div>`}<p class="hint">Este resultado ficará registrado no banco de dados com a data e a titular. Não poderá ser contabilizado em duplicidade.</p><div class="modal-actions"><button type="button" class="btn soft" id="closeCRMOutcome">Voltar</button><button type="submit" class="btn ${won?'result-win':'result-lost'}">${won?'💰 Confirmar plano fechado':'📁 Confirmar cliente perdido'}</button></div></form></div>`;document.body.append(modalBox);modalBox.querySelector('#closeCRMOutcome').onclick=()=>modalBox.remove();modalBox.onclick=e=>{if(e.target===modalBox)modalBox.remove()};modalBox.querySelector('form').onsubmit=e=>crmSaveOutcome(e,id,result)}
async function crmSaveOutcome(e,id,result){e.preventDefault();if(isBusy)return;const won=result==='won';if(!confirm(won?'Confirmar que este cliente fechou um plano?':'Confirmar que este cliente está perdido?'))return;isBusy=true;try{const payload={client_id:id,result,reason:won?'':$('#outcomeReason').value,value:won?$('#outcomeValue').value:''};const response=await api('/api/crm/outcome',{method:'POST',body:JSON.stringify(payload)});$('#crmOutcomeModal')?.remove();await Promise.all([refreshCRM(),refreshAppointments(),refreshPublic()]);if(me)me=await api('/api/me');renderPage();if(won){fireworks('💰 PLANO FECHADO! +XP E NOVO SELO!');}toast(response.message,'good')}catch(err){toast(err.message,'bad')}finally{isBusy=false}}
function openCRMBooking(id){if(session?.role!=='member')return toast('Entre como consultora para agendar.','bad');const c=crmData?.mine.find(x=>x.id===id);if(!c)return toast('Cliente não encontrado na sua carteira.','bad');const modalBox=document.createElement('div');modalBox.id='crmBookingModal';modalBox.className='modal-wrap';const day=crmData.date;
modalBox.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">🎯 AGENDAMENTO</div><h2 style="margin:9px 0">${ESC(c.name)}</h2><p class="sub">Agendamento vinculado à sua carteira. Será exibido à equipe e contabilizado no ranking de hoje.</p><form id="crmBookingForm" class="fields space-top"><div><label class="label" for="crmBookingDay">Dia da visita</label><input class="field" id="crmBookingDay" type="date" required min="${day}" max="${addDaysISO(day,120)}" value="${day}"></div><div><label class="label" for="crmBookingTime">Horário</label><input class="field" id="crmBookingTime" type="time" required value="18:00"></div><p class="hint">A titular deve chamar o cliente novamente até o próximo dia útil após a data agendada.</p><div class="modal-actions"><button type="button" class="btn soft" id="closeCRMBooking">Cancelar</button><button type="submit" class="btn gold">📅 Confirmar agendamento</button></div></form></div>`;document.body.append(modalBox);modalBox.querySelector('#closeCRMBooking').onclick=()=>modalBox.remove();modalBox.onclick=e=>{if(e.target===modalBox)modalBox.remove()};modalBox.querySelector('form').onsubmit=e=>crmBookClient(e,id);modalBox.querySelector('#crmBookingDay').focus()}
function addDaysISO(iso,days){const a=new Date(iso+'T12:00:00');a.setDate(a.getDate()+days);return `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`}
async function crmBookClient(e,id){e.preventDefault();if(isBusy)return;const before=me?.metrics?.bookings||0;isBusy=true;try{await api('/api/crm/book',{method:'POST',body:JSON.stringify({client_id:id,scheduled_day:$('#crmBookingDay').value,scheduled_time:$('#crmBookingTime').value})});$('#crmBookingModal')?.remove();await Promise.all([refreshCRM(),refreshAppointments(),refreshPublic()]);if(me)me=await api('/api/me');renderPage();fireworks(before<10&&me?.metrics?.bookings>=10?'💠 10 AGENDAMENTOS NO DIA! SELO DIAMANTE!':'🚀 AGENDAMENTO CONFIRMADO!');toast('🏆 Agendamento confirmado! A equipe já pode ver na Agenda.','good')}catch(err){toast(err.message,'bad')}finally{isBusy=false}}
async function crmClaimClient(id){if(!confirm('Assumir este contato público? Seu novo ciclo de 3 dias úteis começa hoje.'))return;try{await api('/api/crm/claim',{method:'POST',body:JSON.stringify({client_id:id})});await Promise.all([refreshCRM(),refreshAppointments()]);renderPage();toast('🤝 Cliente agora está na sua carteira privada.','good')}catch(err){toast(err.message,'bad')}}
async function crmFollowup(id){if(!confirm('Você já falou novamente com o cliente após a visita? Isso encerrará o acompanhamento.'))return;try{await api('/api/crm/followup',{method:'POST',body:JSON.stringify({appointment_id:id})});await Promise.all([refreshCRM(),refreshAppointments()]);renderPage();toast('✅ Retorno concluído! Bom trabalho.','good');successSound()}catch(err){toast(err.message,'bad')}}
async function crmCancel(id){if(!confirm('Cancelar este agendamento? O ponto será retirado do ranking no dia em que foi registrado.'))return;try{await api('/api/crm/cancel',{method:'POST',body:JSON.stringify({appointment_id:id})});await Promise.all([refreshCRM(),refreshAppointments(),refreshPublic()]);if(me)me=await api('/api/me');renderPage();toast('Agendamento cancelado e ranking corrigido.')}catch(err){toast(err.message,'bad')}}

function openModal(kind,data=null){modal=kind;let content='';const header=`<div class="brand"><img src="logo.webp" alt="Logo"><div class="brand-name"><strong>MISSÃO OURO</strong><small>USINA ALVORADA</small></div></div>`;
 if(kind==='login'){let setup=publicData&&!publicData.setup;content=header+`<h2>${setup?'✨ Ativar painel do gerente':'Entrar na sua missão'}</h2><p>${setup?'Crie o PIN do gerente para começar a cadastrar a equipe e editar as missões.':'Selecione seu perfil e entre com o PIN fornecido pelo gerente.'}</p><form id="loginForm" class="fields">${!setup?`<div><label class="label">Tipo de acesso</label><select id="loginRole" class="field"><option value="member">👩‍💼 Consultora</option><option value="admin">⚙️ Gerente</option></select></div><div id="memberChoice"><label class="label">Meu perfil</label><select class="field" id="memberId">${(publicData?.members||[]).map(m=>`<option value="${m.id}">${ESC(m.name)} · ${ESC(SHIFTS[m.shift])}</option>`).join('')||'<option value="">Nenhum perfil cadastrado</option>'}</select></div>`:''}<div><label class="label">${setup?'Crie um PIN de 6 a 12 números':'Seu PIN'}</label><input class="field" type="password" inputmode="numeric" pattern="[0-9]*" minlength="${setup?6:4}" maxlength="12" required id="loginPin" autocomplete="off" placeholder="••••••"></div>${setup?`<div><label class="label">Confirme o PIN</label><input class="field" type="password" inputmode="numeric" minlength="6" maxlength="12" required id="loginConfirm" autocomplete="off"></div>`:''}<div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">Cancelar</button><button class="btn gold" type="submit">${setup?'Ativar Central':'Entrar'}</button></div></form>`}
 if(kind==='member'){const m=data||{};content=header+`<h2>${m.id?'Editar consultora':'Nova consultora'}</h2><p>${m.id?'O PIN só precisa ser preenchido se desejar trocá-lo.':'Crie um nome, turno e PIN individual para a consultora.'}</p><form id="memberForm" class="fields"><input type="hidden" id="memberEditId" value="${m.id||''}"><div><label class="label">Nome da consultora</label><input class="field" required id="memberName" maxlength="60" value="${ESC(m.name||'')}" placeholder="Nome completo"></div><div><label class="label">Turno</label><select class="field" id="memberShift">${Object.keys(SHIFTS).map(s=>`<option value="${s}" ${m.shift===s?'selected':''}>${ESC(SHIFTS[s])}</option>`).join('')}</select></div><div><label class="label">${m.id?'Novo PIN (opcional)':'PIN de 4 a 12 números'}</label><input class="field" id="memberPin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="12" ${m.id?'':'required'} placeholder="••••"></div>${m.id?`<div><label class="label"><input type="checkbox" id="memberActive" ${m.active?'checked':''}> Perfil ativo</label></div>`:''}<div class="modal-actions"><button class="btn soft" type="button" data-action="closeModal">Cancelar</button><button class="btn gold" type="submit">💾 Salvar perfil</button></div></form>`}
 if(kind==='confirmReset'){content=header+`<h2>Reiniciar este bloco?</h2><p>O tempo acumulado e o status de conclusão serão zerados. Contagem e anotação permanecerão.</p><div class="modal-actions"><button class="btn soft" data-action="closeModal">Cancelar</button><button class="btn danger" data-action="confirmReset">Reiniciar</button></div>`}
 const wrap=document.createElement('div');wrap.className='modal-wrap';wrap.id='modalOverlay';wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${content}</div>`;document.body.append(wrap);$('#loginRole')?.addEventListener('change',e=>{$('#memberChoice').hidden=e.target.value==='admin'});$('#loginForm')?.addEventListener('submit',loginSubmit);$('#memberForm')?.addEventListener('submit',memberSubmit);wrap.addEventListener('click',e=>{if(e.target===wrap)closeModal()});setTimeout(()=>wrap.querySelector('input:not([type=hidden])')?.focus(),25)}

 const role=setup?'admin':$('#loginRole').value;const member_id=role==='member'?Number($('#memberId').value):undefined;const result=await api('/api/login',{method:'POST',body:JSON.stringify({role,pin,member_id})});token=result.token;localStorage.setItem('missao.demo.token',token);session=await api('/api/session');if(role==='member'){me=await api('/api/me');view='mission';focusId=me.daily.tasks.find(t=>!t.done)?.id}else{admin=await api('/api/admin');view='admin'}closeModal();render();if(role==='admin')startAdminNoticeWatch();toast('Acesso liberado! Bem-vinda à Missão Ouro.','good')}catch(err){toast(err.message,'bad')}}

async function logout(){crmData=null;appointmentData=null;try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}token='';session=null;admin=null;me=null;draft=null;localStorage.removeItem('missao.demo.token');view='ranking';await refreshPublic();render();toast('Sessão encerrada.')}
async function memberTask(id,action,extra={}){if(isBusy)return;isBusy=true;try{const result=await api('/api/member/task',{method:'POST',body:JSON.stringify({task_id:id,action,...extra})});me=await api('/api/me');renderPage();if(result.early&&action==='complete')fireworks();else if(action==='complete')toast('✅ Bloco finalizado!','good');}catch(err){toast(err.message,'bad')}finally{isBusy=false}}
async function booking(delta){if(isBusy)return;if(!session||session.role!=='member'){openModal('login');return}if(delta<0&&!confirm('Retirar 1 agendamento registrado hoje? Essa correção ficará no histórico.'))return;const before=me?.metrics?.bookings||0;isBusy=true;try{await api('/api/member/bookings',{method:'POST',body:JSON.stringify({delta})});me=await api('/api/me');await refreshPublic();renderPage();if(delta>0){if(before<10&&me.metrics.bookings>=10)fireworks('💠 10 AGENDAMENTOS NO DIA! SELO DIAMANTE!');else successSound();toast('🎯 Agendamento registrado no ranking!','good')}else toast('Agendamento corrigido.')}catch(e){toast(e.message,'bad')}finally{isBusy=false}}
async function countUpdate(diff){const t=me?.daily.tasks.find(x=>x.id===focusId);if(!t)return;await memberTask(t.id,'count',{count:Math.max(0,t.count+diff)})}
async function notesUpdate(type){try{if(type==='task'){const note=$('#taskNote')?.value||'';await api('/api/member/task',{method:'POST',body:JSON.stringify({task_id:focusId,action:'note',note})})}else{await api('/api/member/notes',{method:'POST',body:JSON.stringify({notes:$('#dailyNotes')?.value||''})})}me=await api('/api/me');toast('📝 Anotações salvas.','good')}catch(err){toast(err.message,'bad')}}
function reportText(){const m=me.metrics;return [`MISSÃO OURO — USINA ALVORADA`,`Data: ${dateLabel(me.date)}`,`Consultora: ${me.member.name}`,`Turno: ${SHIFTS[me.member.shift]}`,`Escala: ${me.plan.windows.map(w=>w.join("–")).join(" / ")}`,`Intervalos: ${(me.plan.breaks||[]).map(w=>w.join("–")).join(" / ")||"Sem intervalo interno"}`,`Agendamentos: ${m.bookings}`,`Contatos: ${m.contacts}`,`Indicações: ${m.leads}`,`Blocos concluídos: ${m.blocks}/${m.total_blocks}`,`Concluídos antes do prazo: ${m.early}`,`Planos fechados: ${m.sales}`,`Clientes perdidos: ${m.lost}`,`Experiência: ${m.xp} XP`, '',...me.daily.tasks.map(t=>`${t.done?'✓':'○'} ${t.title} — início ${t.start_time||'não definido'}, previsto ${t.minutes}min, utilizado ${formatDuration(t.elapsed+(t.started_at?Math.max(0,Math.floor(Date.now()/1000-t.started_at)):0))}${t.count?' | Realizados: '+t.count:''}${t.note?' | '+t.note:''}`), '', 'OBSERVAÇÕES GERAIS', me.daily.notes||'(nenhuma)'].join('\n')}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('📋 Relatório copiado!','good')}catch{const e=document.createElement('textarea');e.value=s;document.body.append(e);e.select();document.execCommand('copy');e.remove();toast('Relatório copiado.')}}
function tickClocks(){if(!me||view!=='mission')return;for(const e of $$('[data-clock]')){const task=me.daily.tasks.find(t=>t.id===e.dataset.clock);if(!task)continue;const n=remaining(task);e.textContent=fmtTimer(task);e.classList.toggle('overtime',n<0);e.classList.toggle('neg',n<0);if(n<=0&&task.started_at&&!alerted.has(task.id)){alerted.add(task.id);toast(`⏰ ${task.title}: tempo previsto encerrado!`);if(soundEnabled)successSound()}}}
function updateMissionLive(){if(!me||!$('#page'))return;const m=me.metrics,p=me.plan;const hero=$('#heroBookings'),bar=$('#heroBookingBar');if(hero)hero.innerHTML=`${m.bookings}<span> / ${p.goals.bookings}</span>`;if(bar)bar.style.width=pct(m.bookings,p.goals.bookings)+'%';const leaderboard=$('#miniRanking');if(leaderboard)leaderboard.innerHTML=miniRanking();const prev=$('#taskList');if(prev){for(const t of me.daily.tasks){const target=prev.querySelector(`[data-focus="${CSS.escape(t.id)}"]`);if(target){target.classList.toggle('complete',t.done);target.classList.toggle('current',t.id===focusId)}}}}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function savePlan(force=false){if(!draft)return;try{const payload=editMemberId!==null?{member_id:editMemberId,plan:draft,force}:{shift:editShift,plan:draft,force};const endpoint=editMemberId!==null?'/api/admin/member-plan':'/api/admin/plan';const result=await api(endpoint,{method:'POST',body:JSON.stringify(payload)});admin=await api('/api/admin');loadEditingPlan();renderPage();toast('✅ Escala publicada. Blocos com registros de hoje continuam preservados.','good')}catch(err){if(['O plano ultrapassa a jornada.','Há blocos sem encaixe ou com horários conflitantes.'].includes(err.message)&&confirm(err.message+' Deseja salvar assim mesmo? Os avisos permanecerão visíveis.'))return savePlan(true);toast(err.message,'bad')}}
async function resetPersonalPlan(){if(editMemberId===null)return;if(!confirm('Remover a escala personalizada desta consultora e voltar ao modelo do turno?'))return;try{await api('/api/admin/member-plan',{method:'POST',body:JSON.stringify({member_id:editMemberId,reset:true})});admin=await api('/api/admin');loadEditingPlan();renderPage();toast('Escala individual removida. O modelo do turno voltou a valer.','good')}catch(e){toast(e.message,'bad')}}
async function saveTemplate(){if(!draft)return;const name=prompt('Nome deste modelo de programação:');if(!name)return;try{await api('/api/admin/template',{method:'POST',body:JSON.stringify({operation:'save',name,plan:draft})});admin=await api('/api/admin');renderPage();toast('📚 Modelo salvo.','good')}catch(e){toast(e.message,'bad')}}
async function deleteTemplate(){const name=$('#templateChoice')?.value;if(!name)return toast('Selecione um modelo.','bad');if(!confirm('Apagar o modelo '+name+'?'))return;try{await api('/api/admin/template',{method:'POST',body:JSON.stringify({operation:'delete',name})});admin=await api('/api/admin');renderPage();toast('Modelo excluído.','good')}catch(e){toast(e.message,'bad')}}
async function loadReport(){try{reportDate=$('#reportDate')?.value||publicData.date;[report,outcomesReport]=await Promise.all([api(`/api/admin/report?date=${encodeURIComponent(reportDate)}`),api(`/api/admin/outcomes?date=${encodeURIComponent(reportDate)}`)]);$('#reportArea').innerHTML=reportCards();$('#outcomeReportArea').innerHTML=outcomesReportCards();toast('Relatório atualizado.','good')}catch(err){toast(err.message,'bad')}}
function exportCsv(){if(!report){toast('Consulte uma data antes de exportar.');return}const rows=[['Data','Consultora','Turno','Agendamentos','Contatos','Indicações','Blocos concluídos','Bloco','Início previsto','Fim previsto','Previsto (min)','Utilizado (seg)','Excedente (seg)','Status','Observação']];for(const r of report.report){for(const t of r.tasks){const used=Number(t.elapsed)+(t.started_at?Math.max(0,Math.floor(Date.now()/1000-t.started_at)):0);rows.push([report.date,r.member.name,SHIFTS[r.member.shift],r.bookings,r.metrics.contacts,r.metrics.leads,r.metrics.blocks,t.title,t.start_time||"",t.end_time||"",t.minutes,used,Math.max(0,used-t.minutes*60),t.done?'Concluído':'Pendente',t.note])}}const cell=v=>'"'+String(v??'').replaceAll('"','""')+'"';download(`Relatorio_Missao_Ouro_${report.date}.csv`,'\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exportado.','good')}
function exportOutcomes(){if(!outcomesReport){toast('Consulte uma data antes de exportar.','bad');return}const rows=[['Data','Resultado','Cliente','Consultora','Valor (R$)','Motivo']];for(const r of outcomesReport.outcomes){rows.push([r.day,r.result==='won'?'Fechou plano':'Cliente perdido',r.client_name,r.member_name,r.value_cents===null?'':(r.value_cents/100).toFixed(2).replace('.',','),r.reason||''])}const cell=v=>'"'+String(v??'').replaceAll('"','""')+'"';download(`Fechamentos_Perdas_Usina_${outcomesReport.date}.csv`,'\ufeff'+rows.map(x=>x.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Fechamentos e perdas exportados.','good')}
async function adjustBookings(id){const input=$(`#adjust-${id}`);if(!input)return;const value=Number(input.value);if(!Number.isInteger(value)||value<0)return toast('Informe um número válido.','bad');if(!confirm('Corrigir o número de agendamentos dessa consultora no dia selecionado?'))return;try{await api('/api/admin/booking-adjust',{method:'POST',body:JSON.stringify({member_id:id,bookings:value,date:reportDate})});await loadReport();await refreshPublic();toast('Resultado corrigido e registrado.','good')}catch(err){toast(err.message,'bad')}}
function updatePlanInputs(e){if(!draft)return;const el=e.target;
 if(el.dataset.planField)draft[el.dataset.planField]=Number(el.value)||0;
 if(el.dataset.planGoal)draft.goals[el.dataset.planGoal]=Number(el.value)||0;
 if(el.dataset.planWindow){const [a,b]=el.dataset.planWindow.split('-').map(Number);draft.windows[a][b]=el.value}
 if(el.dataset.planBreak){const [a,b]=el.dataset.planBreak.split('-').map(Number);draft.breaks[a][b]=el.value}
 if(el.dataset.editField){const row=el.closest('[data-editor-index]'),i=Number(row.dataset.editorIndex),key=el.dataset.editField;draft.items[i][key]=['minutes','goal'].includes(key)?Number(el.value)||0:el.value;
 if(key==='minutes'||key==='start_time'){const end=row.querySelector('.end-badge');if(end){try{end.textContent=draft.items[i].start_time?'Fim '+clockMinute(atMinute(draft.items[i].start_time)+draft.items[i].minutes):'Sem horário'}catch{end.textContent='Inválido'}}}}
 updatePlannerPreview();}
function handlePlanMove(e){const b=e.target.closest('[data-move]');if(!b||!draft)return;const i=Number(b.closest('[data-editor-index]').dataset.editorIndex),action=b.dataset.move,a=draft.items;if(action==='delete'){if(a.length<=1)return toast('Mantenha pelo menos um bloco.');if(!confirm('Excluir este bloco? O histórico já iniciado será preservado.'))return;a.splice(i,1)}else if(action==='up'&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];else if(action==='down'&&i<a.length-1)[a[i],a[i+1]]=[a[i+1],a[i]];$('#editorRows').innerHTML=editorRows();updatePlannerPreview()}
async function routeClick(e){const navTarget=e.target.closest('[data-nav]');if(navTarget){const n=navTarget.dataset.nav;if(n==='admin'&&session?.role!=='admin'){openModal('login');return}if((n==='mission'||n==='achievements')&&session?.role!=='member'){openModal('login');return}view=n;if(n==='admin'&&!admin)admin=await api('/api/admin');if(n==='admin'&&adminTab==='alerts')await loadAlertsAdmin();if(n==='crm')await refreshCRM();if(n==='appointments')await refreshAppointments();render();return}
 const outcome=e.target.closest('[data-crm-outcome]');if(outcome){openCRMOutcome(Number(outcome.dataset.crmClient),outcome.dataset.crmOutcome);return}
 const clientBook=e.target.closest('[data-crm-book]');if(clientBook){openCRMBooking(Number(clientBook.dataset.crmBook));return}
 const crmClaim=e.target.closest('[data-crm-claim]');if(crmClaim){await crmClaimClient(Number(crmClaim.dataset.crmClaim));return}
 const apFollow=e.target.closest('[data-ap-follow]');if(apFollow){await crmFollowup(Number(apFollow.dataset.apFollow));return}
 const apCancel=e.target.closest('[data-ap-cancel]');if(apCancel){await crmCancel(Number(apCancel.dataset.apCancel));return}
 const agTab=e.target.closest('[data-agenda-filter]');if(agTab){agendaFilter=agTab.dataset.agendaFilter;renderPage();return}
 const adminTabButton=e.target.closest('[data-admin-tab]');if(adminTabButton){adminTab=adminTabButton.dataset.adminTab;if(adminTab==='plan'&&!draft)loadEditingPlan();if(adminTab==='alerts')await loadAlertsAdmin();renderPage();return}
 const shiftButton=e.target.closest('[data-switch-plan],[data-admin-edit]');if(shiftButton){editShift=shiftButton.dataset.switchPlan||shiftButton.dataset.adminEdit;editMemberId=null;loadEditingPlan();adminTab='plan';renderPage();return}
 const personButton=e.target.closest('[data-edit-person]');if(personButton){editMemberId=Number(personButton.dataset.editPerson);loadEditingPlan();renderPage();return}
 const addLib=e.target.closest('[data-library]');if(addLib&&draft){const [title,minutes,kind,goal]=LIBRARY[Number(addLib.dataset.library)];draft.items.push({id:'custom-'+Math.random().toString(36).slice(2,13),title,minutes,kind,goal,start_time:''});renderPage();return}
 const remWin=e.target.closest('[data-remove-window]');if(remWin){draft.windows.splice(Number(remWin.dataset.removeWindow),1);renderPage();return}
 const remBreak=e.target.closest('[data-remove-break]');if(remBreak){draft.breaks.splice(Number(remBreak.dataset.removeBreak),1);renderPage();return}
 const editMember=e.target.closest('[data-edit-member]');if(editMember){const m=admin.members.find(x=>x.id===Number(editMember.dataset.editMember));openModal('member',m);return}
 const adjust=e.target.closest('[data-adjust-bookings]');if(adjust){adjustBookings(Number(adjust.dataset.adjustBookings));return}
 const focus=e.target.closest('[data-focus]');if(focus){focusId=focus.dataset.focus;$('#focusPanel').innerHTML=focusBlock(me.daily.tasks.find(t=>t.id===focusId));$('#taskList').innerHTML=tasksList(me.daily.tasks);$('#focusPanel').scrollIntoView({behavior:'smooth',block:'center'});return}
 const task=e.target.closest('[data-task-action]');if(task){const act=task.dataset.taskAction,id=task.dataset.task;if(act==='reset'){focusId=id;openModal('confirmReset');return}memberTask(id,act);return}
 const move=e.target.closest('[data-move]');if(move){handlePlanMove(e);return}
 const a=e.target.closest('[data-action]');if(!a)return;
 switch(a.dataset.action){case 'goCRM':view='crm';await refreshCRM();render();break;case 'goAgenda':view='appointments';await refreshAppointments();render();break;case 'toggleClosed':crmShowClosed=!crmShowClosed;renderPage();break;case 'login':openModal('login');break;case 'logout':logout();break;case 'closeModal':closeModal();break;case 'plusBooking':booking(1);break;case 'minusBooking':booking(-1);break;case 'countPlus':countUpdate(1);break;case 'countMinus':countUpdate(-1);break;case 'saveTaskNote':notesUpdate('task');break;case 'saveNotes':notesUpdate('daily');break;case 'copyMyReport':copyText(reportText());break;case 'toggleSound':soundEnabled=!soundEnabled;toast(soundEnabled?'🔊 Som ativado.':'🔇 Som desativado.');renderPage();break;
 case 'addWindow':if(draft.windows.length>=3){toast('Limite de 3 faixas.','bad');break}draft.windows.push(['','']);renderPage();break;
 case 'addBreak':if(draft.breaks.length>=3){toast('Limite de 3 intervalos.','bad');break}draft.breaks.push(['','']);renderPage();break;
 case 'autoDistribute':try{autoDistribute(draft);renderPage();toast('Horários distribuídos. Confira os avisos e publique a rotina.','good')}catch(e){toast(e.message,'bad')}break;
 case 'clearStarts':draft.items.forEach(t=>t.start_time='');renderPage();break;
 case 'duplicateTask':{const orig=draft.items.at(-1);draft.items.push({...structuredClone(orig),id:'custom-'+Math.random().toString(36).slice(2,13),start_time:''});renderPage();break;}
 case 'applyBulkMinutes':{const min=Number($('#bulkMinutes')?.value);if(!Number.isInteger(min)||min<1||min>300)return toast('Use de 1 a 300 minutos.','bad');if(!confirm('Alterar a duração de TODOS os blocos para '+min+' minutos?'))break;draft.items.forEach(t=>t.minutes=min);renderPage();break;}
 case 'applyTemplate':{const name=$('#templateChoice')?.value;if(!name||!admin.templates?.[name]){toast('Selecione um modelo.','bad');break}draft.items=structuredClone(admin.templates[name].items).map(t=>({...t,start_time:''}));try{autoDistribute(draft)}catch{}renderPage();toast('Blocos do modelo aplicados. Sua jornada e seus intervalos foram mantidos.','good');break;}
 case 'saveTemplate':saveTemplate();break;case 'deleteTemplate':deleteTemplate();break;case 'resetPersonalPlan':resetPersonalPlan();break;
 case 'refreshAlerts':await loadAlertsAdmin();refreshAlertPanels();toast('Avisos atualizados.','good');break;case 'scheduleNotice':await createScheduledNotice();break;case 'exportNoticeReport':await exportNoticeReport();break;
 case 'tvMode':window.open(location.pathname+'?tv=1','_blank','noopener');break;case 'newMember':openModal('member');break;case 'addTask':draft.items.push({id:'custom-'+Math.random().toString(36).slice(2,12),title:'Novo afazer',minutes:15,kind:'routine',goal:0,start_time:''});renderPage();break;
 case 'discardPlan':loadEditingPlan();renderPage();toast('Edição descartada.');break;
 case 'savePlan':savePlan();break;case 'loadReport':loadReport();break;case 'exportCsv':exportCsv();break;case 'exportOutcomes':exportOutcomes();break;
 case 'confirmReset':closeModal();memberTask(focusId,'reset');break;
 }}
 document.addEventListener('click',e=>routeClick(e).catch(err=>toast(err.message,'bad')));
 document.addEventListener('submit',e=>{
 if(e.target.id==='crmClientForm')crmCreateClient(e).catch(err=>toast(err.message,'bad'));
 if(e.target.id==='alertSendForm')sendManagerNotice(e).catch(err=>toast(err.message,'bad'));
 if(e.target.id==='alertPairForm')pairDesktop(e).catch(err=>toast(err.message,'bad'));
 });
 document.addEventListener('click',e=>{if(e.target.closest('[data-device-toggle]'))toggleDesktop(e).catch(err=>toast(err.message,'bad'));const schedule=e.target.closest('[data-schedule-toggle]');if(schedule)toggleNoticeSchedule(schedule).catch(err=>toast(err.message,'bad'))});
document.addEventListener('change',e=>{if(e.target.id==='alertScheduleMode')updateScheduleMode()});
document.addEventListener('input',e=>{if(e.target.closest('#editorRows')||e.target.dataset.planField||e.target.dataset.planGoal||e.target.dataset.planWindow||e.target.dataset.planBreak)updatePlanInputs(e)});
 let dragIndex=null;
 document.addEventListener('dragstart',e=>{const row=e.target.closest?.('.planner-editor-row');if(!row)return;dragIndex=Number(row.dataset.editorIndex);row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragIndex))});
 document.addEventListener('dragover',e=>{const row=e.target.closest?.('.planner-editor-row');if(!row||dragIndex===null)return;e.preventDefault();row.classList.add('drag-hover')});
 document.addEventListener('dragleave',e=>{const row=e.target.closest?.('.planner-editor-row');if(row)row.classList.remove('drag-hover')});
 document.addEventListener('drop',e=>{const row=e.target.closest?.('.planner-editor-row');if(!row||dragIndex===null||!draft)return;e.preventDefault();const dest=Number(row.dataset.editorIndex);if(dest!==dragIndex){const [item]=draft.items.splice(dragIndex,1);draft.items.splice(dest,0,item);$('#editorRows').innerHTML=editorRows();updatePlannerPreview()}dragIndex=null;});
 document.addEventListener('dragend',()=>{dragIndex=null;$$('.planner-editor-row').forEach(x=>x.classList.remove('drag-hover','dragging'))});
 window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 boot();
</script>
</body>
